name: Build SahraMAC APK
on:
  workflow_dispatch:
  push:
    paths:
      - "SahraMAC-Android*.zip"
      - "app/**"
      - "*.kts"
      - ".github/workflows/build-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the project folder if the zip was uploaded as is
        run: |
          Z=$(ls SahraMAC-Android*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$Z" ]; then
            echo "Using $Z"
            rm -rf SahraMAC-Android && unzip -oq "$Z"
          fi
          if [ -d SahraMAC-Android ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/SahraMAC-Android" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Collect the APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$GITHUB_WORKSPACE/SahraMAC.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SahraMAC-apk
          path: SahraMAC.apk
          if-no-files-found: error
