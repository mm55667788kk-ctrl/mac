name: Build SahraMAC 2.0 IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build SahraMAC 2.0
        run: |
          source_dir="$(mktemp -d)"
          unzip -oq SahraMAC-iOS-2.0.zip -d "$source_dir"
          cd "$source_dir/SahraMAC-iOS"
          version="$(plutil -extract CFBundleShortVersionString raw -o - App/Info.plist)"
          if [ "$version" != "2.0" ]; then
            echo "Expected SahraMAC 2.0, found $version"
            exit 1
          fi
          bash build-ipa.sh
          cp SahraMAC.ipa "$GITHUB_WORKSPACE/SahraMAC.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: SahraMAC-2.0-ipa
          path: SahraMAC.ipa
          if-no-files-found: error
