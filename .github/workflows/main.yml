name: Build SahraMAC IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the IPA
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z"; done
          s=$(find . -name build-ipa.sh -not -path './.git/*' | head -1)
          if [ -z "$s" ]; then echo "ارفع ملف SahraMAC-iOS.zip"; exit 0; fi
          bash "$s"
          mv "$(dirname "$s")/SahraMAC.ipa" ./SahraMAC.ipa 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: SahraMAC-ipa
          path: SahraMAC.ipa
