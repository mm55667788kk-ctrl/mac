name: Build SahraMAC IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the IPA
        run: |
          if [ -f SahraMAC-iOS.zip ]; then
            rm -rf SahraMAC-iOS && unzip -oq SahraMAC-iOS.zip && cd SahraMAC-iOS
          fi
          bash build-ipa.sh
          cp SahraMAC.ipa "$GITHUB_WORKSPACE/SahraMAC.ipa" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: SahraMAC-ipa
          path: SahraMAC.ipa
